"""Docker Compose configuration for development and production."""

version: "3.9"

services:
  # PostgreSQL Database
  database:
    image: postgres:15-alpine
    container_name: openbmc-database
    environment:
      POSTGRES_USER: openbmc
      POSTGRES_PASSWORD: openbmc_password_123
      POSTGRES_DB: openbmc_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - openbmc-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openbmc"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: openbmc-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DEBUG: "True"
      DATABASE_URL: postgresql://openbmc:openbmc_password_123@database:5432/openbmc_db
      SECRET_KEY: "your-super-secret-key-change-this-in-production"
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      ENVIRONMENT: development
    volumes:
      - ./backend:/app
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - openbmc-network

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: openbmc-frontend
    environment:
      REACT_APP_API_URL: http://localhost:8000/api/v1
      NODE_ENV: development
    volumes:
      - ./frontend/src:/app/src
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - openbmc-network

  # NGINX Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: openbmc-nginx
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    networks:
      - openbmc-network

volumes:
  postgres_data:

networks:
  openbmc-network:
    driver: bridge